name: adaptive_palette
description: Dynamic theming from images for Flutter. Extract vibrant colors and create accessible Material Design 3 themes with Luma/Spotify-style blurred backgrounds.
version: 1.0.4
homepage: https://github.com/HardikSJain/adaptive_palette
repository: https://github.com/HardikSJain/adaptive_palette
issue_tracker: https://github.com/HardikSJain/adaptive_palette/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_color_utilities: ^0.11.1
  crypto: ^3.0.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true