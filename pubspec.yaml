name: adaptive_palette
description: Production-ready dynamic theming from images. Intelligent color extraction with quality presets, performance monitoring, and Spotify/YouTube-style widgets. Material Design 3 with WCAG accessibility.
version: 2.0.2
homepage: https://github.com/HardikSJain/adaptive_palette
repository: https://github.com/HardikSJain/adaptive_palette
issue_tracker: https://github.com/HardikSJain/adaptive_palette/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_color_utilities: ^0.11.1
  crypto: ^3.0.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true