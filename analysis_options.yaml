include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - example/build/**
    # Separate package with its own dependencies (needs Flutter 3.47+).
    - compat/**
  errors:
    # The deprecated v2 API has to keep referring to itself until it is
    # removed in 4.0.0.
    deprecated_member_use_from_same_package: ignore
