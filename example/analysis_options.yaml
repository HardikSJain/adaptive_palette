include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # The legacy/ examples intentionally demonstrate the deprecated v2 API.
    deprecated_member_use: ignore

linter:
  rules:
    prefer_const_constructors: false
    avoid_print: false
